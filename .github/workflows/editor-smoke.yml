name: Editor smoke checks
on:
  push:
    branches: [main, 'fix/**', 'feature/**']
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check editor inline JavaScript syntax
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('editor.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)].map(m=>m[1]).filter(Boolean);
          if(!scripts.length)throw new Error('No inline script found');
          for(const code of scripts)new Function(code);
          console.log('Parsed',scripts.length,'inline script(s)');
          NODE
